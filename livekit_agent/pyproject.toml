[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-agent"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10"

dependencies = [
    "livekit-agents[silero,turn-detector,openai,groq,google]>=1.5,<2.0",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-groq>=0.1",
    "livekit-plugins-google>=1.5,<2.0",
    "google-genai>=1.0",
    "python-dotenv",
    "livekit-plugins-ai-coustics>=0.2.0",
    "chromadb>=0.4.0",
    "pyloudnorm>=0.1.0",
]

[project.optional-dependencies]
rag-local = [
    "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
chunk-preview = "chunk_preview:main"
ingest-rag = "ingest_rag:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"