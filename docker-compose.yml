# docker-compose.yml — Run everything on a single machine
# Whisper STT (local) + Groq LLM + Groq TTS + LiveKit + Agent + Frontend
# LLM and TTS are handled by Groq cloud (requires GROQ_API_KEY in .env)
#
# Usage:
#   docker compose up --build

services:

  # ─── STT — Whisper (via VoxBox) ──────────────────────────────────────────────
  whisper:
    build:
      context: ./inference/whisper
    restart: unless-stopped
    volumes:
      - whisper-data:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - VOXBOX_DEVICE=${VOXBOX_DEVICE:-cpu}
      - DATA_DIR=/data
    ports:
      - "11435:80"
    networks:
      - agent_network

  # ─── LiveKit Server ──────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind "0.0.0.0"
    networks:
      - agent_network

  # ─── LiveKit Agent ───────────────────────────────────────────────────────────
  livekit_agent:
    build:
      context: ./livekit_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_AGENT_PORT=7880
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_BASE_URL=http://whisper:80/v1
      - STT_MODEL=${STT_MODEL:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - STT_API_KEY=no-key-needed
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-openai/gpt-oss-20b}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_VOICE=${TTS_VOICE:-fahad}
      # Call Logs
      - CALL_LOGS=/app/call_logs
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - RAG_CHROMA_PATH=${RAG_CHROMA_PATH:-/app/rag/chroma}
      - RAG_COLLECTION_NAME=${RAG_COLLECTION_NAME:-call_center_knowledge_chroma}
      - RAG_EMBEDDING_PROVIDER=${RAG_EMBEDDING_PROVIDER:-chroma}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-}
      - RAG_TOP_K=${RAG_TOP_K:-2}
      - RAG_MAX_CONTEXT_CHARS=${RAG_MAX_CONTEXT_CHARS:-1000}
      - RAG_EMBEDDING_DEVICE=${RAG_EMBEDDING_DEVICE:-}
      - RAG_KNOWLEDGE_DIR=${RAG_KNOWLEDGE_DIR:-/app/knowledge_base}
    volumes:
      - ./rag/chroma:/app/rag/chroma
      - ./livekit_agent/knowledge_base:/app/knowledge_base
      - ./livekit_agent/call_logs:/app/call_logs
    depends_on:
      livekit:
        condition: service_started
      whisper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - agent_network

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      livekit:
        condition: service_started
    networks:
      - agent_network

volumes:
  whisper-data:

networks:
  agent_network:
    driver: bridge
