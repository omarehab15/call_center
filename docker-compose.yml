# docker-compose.yml — Run everything on a single machine
# Whisper STT + habibi-TTS + Groq LLM + LiveKit + Agent + Frontend
#
# Usage:
#   docker compose up --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build  # with GPU

services:

  # ─── STT — Whisper (via VoxBox) ──────────────────────────────────────────────
  whisper:
    build:
      context: ./inference/whisper
    volumes:
      - whisper-data:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - VOXBOX_DEVICE=${VOXBOX_DEVICE:-cpu}
      - DATA_DIR=/data
    ports:
      - "11435:80"
    networks:
      - agent_network

  # ─── TTS — habibi-tts (local GPU) ────────────────────────────────────────────
  habibi_tts:
    build:
      context: ./inference/habibi
      args:
        HABIBI_MODEL: ${HABIBI_MODEL:-Unified}
    environment:
      - HABIBI_MODEL=${HABIBI_MODEL:-Unified}
      - HABIBI_VOICE=${HABIBI_VOICE:-SAU_male_1}
      - HABIBI_NFE=${HABIBI_NFE:-16}
    ports:
      - "11437:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ─── LiveKit Server ──────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind "0.0.0.0"
    networks:
      - agent_network

  # ─── LiveKit Agent ───────────────────────────────────────────────────────────
  livekit_agent:
    build:
      context: ./livekit_agent
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_AGENT_PORT=7880
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_BASE_URL=http://whisper:80/v1
      - STT_MODEL=${STT_MODEL:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - STT_API_KEY=no-key-needed
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.3-70b-versatile}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_BASE_URL=http://habibi_tts:8000/v1
      - TTS_VOICE=${TTS_VOICE:-SAU_male_1}
    depends_on:
      livekit:
        condition: service_started
      habibi_tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - agent_network

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      livekit:
        condition: service_started
    networks:
      - agent_network

volumes:
  whisper-data:

networks:
  agent_network:
    driver: bridge
