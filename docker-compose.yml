# docker-compose.yml — Run everything on a single machine
# Whisper STT + llama.cpp LLM + LiveKit + Agent + Frontend
# TTS is handled by Groq cloud (requires GROQ_API_KEY in .env)
#
# Usage:
#   docker compose up --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build  # with GPU

services:

  # ─── STT — Whisper (via VoxBox) ──────────────────────────────────────────────
  whisper:
    build:
      context: ./inference/whisper
    volumes:
      - whisper-data:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - VOXBOX_DEVICE=${VOXBOX_DEVICE:-cpu}
      - DATA_DIR=/data
    ports:
      - "11435:80"
    networks:
      - agent_network

  # ─── LLM — llama.cpp ────────────────────────────────────────────────────────
  llama_cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --hf-repo
      - "${LLAMA_HF_REPO:-bartowski/ALLaM-AI_ALLaM-7B-Instruct-preview-GGUF}"
      - --hf-file
      - "${LLAMA_HF_FILE:-ALLaM-AI_ALLaM-7B-Instruct-preview-Q6_K_L.gguf}"
      - --alias
      - "${LLAMA_MODEL_ALIAS:-allam-7b}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-8192}"
      - --n-gpu-layers
      - "999"
      - --batch-size
      - "512"
      - --threads
      - "8"
      - --flash-attn
      - "on"
    ports:
      - "${LLAMA_HOST_PORT:-11436}:11434"
    volumes:
      - ./inference/llama/models:/models
    environment:
      - XDG_CACHE_HOME=/models
      - HF_HOME=/models
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/v1/models > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ─── LiveKit Server ──────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind "0.0.0.0"
    networks:
      - agent_network

  # ─── LiveKit Agent ───────────────────────────────────────────────────────────
  livekit_agent:
    build:
      context: ./livekit_agent
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_AGENT_PORT=7880
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_BASE_URL=http://whisper:80/v1
      - STT_MODEL=${STT_MODEL:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - STT_API_KEY=no-key-needed
      - LLAMA_BASE_URL=http://llama_cpp:11434/v1
      - LLAMA_MODEL=${LLAMA_MODEL:-allam-7b}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_VOICE=${TTS_VOICE:-fahad}
    depends_on:
      livekit:
        condition: service_started
      llama_cpp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - agent_network

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      livekit:
        condition: service_started
    networks:
      - agent_network

volumes:
  whisper-data:

networks:
  agent_network:
    driver: bridge
