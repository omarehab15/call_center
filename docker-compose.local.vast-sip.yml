# docker-compose.local.vast-sip.yml — Vast-friendly SIP testing overlay
# Use with:
#   docker compose -f docker-compose.local.yml -f docker-compose.local.vast-sip.yml --env-file .env.local up --build
#
# This overlay narrows SIP RTP media ports for environments with limited exposed
# port budgets (for example, Vast.ai instances).

services:
  sip:
    ports: !override
      - "${SIP_SIGNALING_PORT:-5060}:5060/udp"
      - "${SIP_SIGNALING_PORT:-5060}:5060/tcp"
      - "${SIP_TLS_PORT:-5061}:5061/tcp"
      - "${SIP_TEST_RTP_PORT_START:-12000}-${SIP_TEST_RTP_PORT_END:-12031}:${SIP_TEST_RTP_PORT_START:-12000}-${SIP_TEST_RTP_PORT_END:-12031}/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY:-devkey}'
        api_secret: '${LIVEKIT_API_SECRET:-secret}'
        ws_url: 'ws://livekit:7880'
        redis:
          address: 'redis:6379'
        sip_port: 5060
        rtp_port: ${SIP_TEST_RTP_PORT_START:-12000}-${SIP_TEST_RTP_PORT_END:-12031}
        use_external_ip: ${SIP_USE_EXTERNAL_IP:-true}
        logging:
          level: ${SIP_LOG_LEVEL:-info}
