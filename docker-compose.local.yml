# docker-compose.local.yml — Local web stack with optional self-hosted SIP
# Default: LiveKit server + Redis + LiveKit Agent + Frontend
# Optional profile "sip": LiveKit SIP service
# STT runs on a remote machine (via Tailscale), LLM + TTS via Groq cloud
#
# Usage:
#   docker compose -f docker-compose.local.yml --env-file .env.local up --build

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - local_network

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind "0.0.0.0" --redis-host redis:6379
    depends_on:
      redis:
        condition: service_started
    networks:
      - local_network

  sip:
    image: livekit/sip:latest
    profiles:
      - sip
    # For Linux production deployments, host networking is often preferred for SIP/RTP:
    # network_mode: host
    # If you enable host networking, remove the explicit ports mapping below.
    ports:
      - "${SIP_SIGNALING_PORT:-5060}:5060/udp"
      - "${SIP_SIGNALING_PORT:-5060}:5060/tcp"
      - "${SIP_TLS_PORT:-5061}:5061/tcp"
      - "${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-20000}:${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-20000}/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY:-devkey}'
        api_secret: '${LIVEKIT_API_SECRET:-secret}'
        ws_url: 'ws://livekit:7880'
        redis:
          address: 'redis:6379'
        sip_port: 5060
        rtp_port: ${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-20000}
        use_external_ip: ${SIP_USE_EXTERNAL_IP:-true}
        logging:
          level: ${SIP_LOG_LEVEL:-info}
    networks:
      - local_network
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_started

  livekit_agent:
    build:
      context: ./livekit_agent
    env_file:
      - .env.local
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_AGENT_PORT=7880
      # STT — remote (via Tailscale)
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_BASE_URL=${STT_BASE_URL}
      - STT_MODEL=${STT_MODEL:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - STT_API_KEY=${STT_API_KEY:-no-key-needed}
      # LLM + TTS — Groq cloud
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.3-70b-versatile}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_VOICE=${TTS_VOICE:-fahad}
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - local_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      livekit:
        condition: service_started
    networks:
      - local_network

volumes:
  redis-data:

networks:
  local_network:
    driver: bridge
