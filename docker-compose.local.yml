# docker-compose.local.yml — Run on your local machine
# LiveKit server + LiveKit Agent + Frontend + Habibi-TTS
# STT runs on a remote machine (via Tailscale), LLM via Groq cloud, TTS local
#
# Usage:
#   docker compose -f docker-compose.local.yml --env-file .env.local up --build

services:
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    command: --dev --bind "0.0.0.0"
    networks:
      - local_network

  # ─── TTS — Habibi-TTS (local, OpenAI-compatible) ─────────────────────────────
  habibi_tts:
    build:
      context: ./inference/habibi_tts
    environment:
      - HABIBI_DIALECT=${HABIBI_DIALECT:-SAU}
    volumes:
      - habibi-model-cache:/root/.cache
    ports:
      - "8002:8000"
    networks:
      - local_network

  livekit_agent:
    build:
      context: ./livekit_agent
    env_file:
      - .env.local
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_AGENT_PORT=7880
      # STT — remote (via Tailscale)
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_BASE_URL=${STT_BASE_URL}
      - STT_MODEL=${STT_MODEL:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - STT_API_KEY=${STT_API_KEY:-no-key-needed}
      # LLM — Groq cloud
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.3-70b-versatile}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # TTS — Habibi-TTS local container
      - TTS_VOICE=${TTS_VOICE:-SAU}
      - HABIBI_TTS_BASE_URL=http://habibi_tts:8000/v1
    depends_on:
      livekit:
        condition: service_started
      habibi_tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - local_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      livekit:
        condition: service_started
    networks:
      - local_network

volumes:
  habibi-model-cache:

networks:
  local_network:
    driver: bridge
