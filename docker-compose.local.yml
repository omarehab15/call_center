# docker-compose.local.yml — Local web stack with optional self-hosted SIP
# Default: LiveKit server + Redis + LiveKit Agent + Frontend
# Optional profile "sip": LiveKit SIP service
# STT runs on a remote machine (via Tailscale), LLM + TTS via Groq cloud
#
# Usage:
#   docker compose -f docker-compose.local.yml --env-file .env.local up --build -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - local_network

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
    # FIX: --node-ip forces LiveKit to advertise its Docker-internal IP
    # to the SIP container instead of the public IP (156.216.68.22).
    # Without this, SIP tries to reach LiveKit from outside the Docker
    # network and RTP from the agent never reaches the SIP container.
    command: --dev --bind "0.0.0.0" --redis-host redis:6379 --node-ip livekit
    depends_on:
      redis:
        condition: service_started
    networks:
      - local_network

  sip:
    image: livekit/sip:latest
    restart: unless-stopped
    profiles:
      - sip
    # PORT MAPPING STRATEGY FOR WINDOWS DOCKER DESKTOP:
    #
    # The original 10000-20000 UDP range (10001 ports) caused ~220s hang on
    # Windows Docker Desktop. The fix is a small fixed RTP window of 32 ports
    # which is enough for ~16 concurrent SIP calls and binds instantly.
    #
    # Port 5060: SIP signaling — required so Twilio/provider can reach us
    # Port 10000-10031: RTP media — required so audio flows back to caller
    #
    # If you still see startup delays, reduce RTP window further or use
    # SIP_TEST_RTP_PORT_START/END in .env.local to override.
    stop_grace_period: 5s
    ports:
      - "${SIP_SIGNALING_PORT:-5060}:5060/udp"
      - "${SIP_SIGNALING_PORT:-5060}:5060/tcp"
      - "${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-10031}:${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-10031}/udp"
    
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY:-devkey}'
        api_secret: '${LIVEKIT_API_SECRET:-secret}'
        ws_url: 'ws://livekit:7880'
        redis:
          address: 'redis:6379'
        sip_port: 5060
        rtp_port: ${SIP_RTP_PORT_START:-10000}-${SIP_RTP_PORT_END:-10031}
        use_external_ip: ${SIP_USE_EXTERNAL_IP:-false}
        logging:
          level: ${SIP_LOG_LEVEL:-info}
    networks:
      - local_network
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_started

  livekit_agent:
    build:
      context: ./livekit_agent
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_AGENT_PORT=7880
      # STT — remote (via Tailscale)
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_BASE_URL=${STT_BASE_URL}
      - STT_MODEL=${STT_MODEL:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
      - STT_API_KEY=${STT_API_KEY:-no-key-needed}
      # LLM + TTS — Groq cloud
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-openai/gpt-oss-20b}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TTS_VOICE=${TTS_VOICE:-fahad}
      # Call Logs
      - CALL_LOGS=/app/call_logs
      # RAG
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - RAG_CHROMA_PATH=${RAG_CHROMA_PATH:-/app/rag/chroma}
      - RAG_COLLECTION_NAME=${RAG_COLLECTION_NAME:-call_center_knowledge}
      - RAG_EMBEDDING_PROVIDER=${RAG_EMBEDDING_PROVIDER:-chroma}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-}
      - RAG_EMBEDDING_API_KEY=${RAG_EMBEDDING_API_KEY:-}
      - RAG_EMBEDDING_BASE_URL=${RAG_EMBEDDING_BASE_URL:-}
      - RAG_EMBEDDING_DEVICE=${RAG_EMBEDDING_DEVICE:-}
      - RAG_TOP_K=${RAG_TOP_K:-4}
      - RAG_MAX_CONTEXT_CHARS=${RAG_MAX_CONTEXT_CHARS:-1800}
      - RAG_KNOWLEDGE_DIR=${RAG_KNOWLEDGE_DIR:-/app/knowledge_base}
    volumes:
      - ${RAG_CHROMA_PATH_HOST:-./rag/chroma}:${RAG_CHROMA_PATH:-/app/rag/chroma}
      - ${RAG_KNOWLEDGE_DIR_HOST:-./livekit_agent/knowledge_base}:${RAG_KNOWLEDGE_DIR:-/app/knowledge_base}
      - ${CALL_LOGS_HOST:-./livekit_agent/call_logs}:${CALL_LOGS:-/app/call_logs}
    depends_on:
      livekit:
        condition: service_started
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - local_network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    stop_grace_period: 5s
    depends_on:
      livekit:
        condition: service_started
    networks:
      - local_network

volumes:
  redis-data:

networks:
  local_network:
    driver: bridge