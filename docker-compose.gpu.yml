# docker-compose.gpu.yml — GPU overlay for docker-compose.yml
# Use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

services:

  whisper:
    environment:
      - VOXBOX_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  habibi_tts:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
