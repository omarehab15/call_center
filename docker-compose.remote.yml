# docker-compose.remote.yml — Run on the vast.ai GPU machine
# Serves STT (Nemotron), LLM (llama.cpp), and TTS (Kokoro) models over HTTP
# All endpoints are OpenAI-compatible and exposed on 0.0.0.0 for Tailscale access
services:
  xtts:
    image: ghcr.io/matatonic/openedai-speech:latest
    ports:
      - "8880:8000"
    environment:
      - TTS_HOME=/models
      - HF_HOME=/models
      - PRELOAD_MODEL=xtts
      - COQUI_TOS_AGREED=1
    volumes:
      - xtts-cache:/models
    restart: unless-stopped

  whisper:
    build:
      context: ./inference/whisper
    volumes:
      - whisper-cache:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-h2oai/faster-whisper-large-v3-turbo}
    ports:
      - "11435:80"
    restart: unless-stopped

  llama_cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --hf-repo
      - "${LLAMA_HF_REPO:-unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF}"
      - --hf-file
      - "${LLAMA_HF_FILE:-Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf}"
      - --alias
      - "${LLAMA_MODEL_ALIAS:-qwen3-30b}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-16384}"
    ports:
      - "${LLAMA_HOST_PORT:-11436}:11434"
    volumes:
      - ./inference/llama/models:/models
    environment:
      - XDG_CACHE_HOME=/models
      - HF_HOME=/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/v1/models > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  whisper-cache:
  xtts-cache:
