# docker-compose.remote.yml — Run on the vast.ai GPU machine
# Serves STT (Whisper), LLM (llama.cpp), and TTS (lahgtna-chatterbox) over HTTP
# All endpoints are OpenAI-compatible and exposed on 0.0.0.0 for Tailscale access

services:


  # ─────────────────────────────────────────────────────────────────────────────
  # STT — Whisper (via VoxBox)
  # ─────────────────────────────────────────────────────────────────────────────
  whisper:
    build:
      context: ./inference/whisper
    volumes:
      - whisper-cache:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
    ports:
      - "11435:80"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # LLM — llama.cpp
  # ─────────────────────────────────────────────────────────────────────────────
  llama_cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --host
      - 0.0.0.0
      - --port
      - "11434"
      - --hf-repo
      - "${LLAMA_HF_REPO:-unsloth/gemma-4-26B-A4B-it-GGUF}"
      - --hf-file
      - "${LLAMA_HF_FILE:-gemma-4-26B-A4B-it-UD-Q4_K_M.gguf}"
      - --alias
      - "${LLAMA_MODEL_ALIAS:-gemma-4-26b}"
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-16384}"
      - --flash-attn
    ports:
      - "${LLAMA_HOST_PORT:-11436}:11434"
    volumes:
      - ./inference/llama/models:/models
    environment:
      - XDG_CACHE_HOME=/models
      - HF_HOME=/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/v1/models > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  whisper-cache: