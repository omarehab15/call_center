# docker-compose.remote.yml — Run on the vast.ai GPU machine
# Serves STT (Whisper) + TTS (habibi-tts) over HTTP
# All endpoints are OpenAI-compatible and exposed on 0.0.0.0 for Tailscale access

services:

  # ─── STT — Whisper (via VoxBox) ──────────────────────────────────────────────
  whisper:
    build:
      context: ./inference/whisper
    volumes:
      - whisper-cache:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
    ports:
      - "11435:80"
    restart: unless-stopped

  # ─── TTS — habibi-tts (local GPU) ────────────────────────────────────────────
  habibi_tts:
    build:
      context: ./inference/habibi
      args:
        HABIBI_MODEL: ${HABIBI_MODEL:-Unified}
    environment:
      - HABIBI_MODEL=${HABIBI_MODEL:-Unified}
      - HABIBI_VOICE=${HABIBI_VOICE:-SAU_male_1}
      - HABIBI_NFE=${HABIBI_NFE:-16}
    ports:
      - "11437:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  whisper-cache:
