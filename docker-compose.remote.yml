# docker-compose.remote.yml — Run on the vast.ai GPU machine
# Serves STT (Whisper) + TTS (Habibi-TTS) — LLM is handled by Groq cloud
# Both endpoints are exposed on 0.0.0.0 for Tailscale access

services:

  # ─── STT — Whisper (via VoxBox) ──────────────────────────────────────────────
  whisper:
    build:
      context: ./inference/whisper
    volumes:
      - whisper-cache:/data
    environment:
      - VOXBOX_HF_REPO_ID=${VOXBOX_HF_REPO_ID:-dev-ahmedhany/whisper-large-v3-arabic-ft-v3-ct2-int8}
    ports:
      - "11435:80"
    restart: unless-stopped

  # ─── TTS — Habibi-TTS (local, OpenAI-compatible) ─────────────────────────────
  habibi_tts:
    build:
      context: ./inference/habibi_tts
    environment:
      - HABIBI_DIALECT=${HABIBI_DIALECT:-SAU}
    volumes:
      - habibi-model-cache:/root/.cache
    ports:
      - "8002:8000"
    restart: unless-stopped

volumes:
  whisper-cache:
  habibi-model-cache:
