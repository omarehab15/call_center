# GPU overlay for docker-compose.remote.yml
# Use with: docker compose -f docker-compose.remote.yml -f docker-compose.remote-gpu.yml up
services:
  lahgtna:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama_cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - LLAMA_ARG_N_GPU_LAYERS=${LLAMA_N_GPU_LAYERS:--1}
      - LLAMA_ARG_FLASH_ATTN=1

  whisper:
    environment:
      - VOXBOX_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]