# GPU overlay for docker-compose.remote.yml
# Use with: docker compose -f docker-compose.remote.yml -f docker-compose.remote-gpu.yml up
services:


  llama_cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  whisper:
    environment:
      - VOXBOX_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]